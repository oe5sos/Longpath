<?xml version="1.0" encoding="UTF-8"?>
<!--
  Longpath — Bildmarke.

  Das O aus dem Schriftzug, herausgeloest: ein Ring mit dem langen Weg
  darin. Der kurze Weg (gestrichelt) faellt hier weg, weil er unter
  32 Bildpunkten ohnehin verschwindet und die Marke bei kleinen
  Groessen nur zusetzt.

  Farben aus src/gui/StyleConstants.h:
    Ring  kTextPrimary  #c4c4c9
    Weg   kAmberText    #c2924f

  Auf hellem Grund muss der Ring auf #16161a und der Weg auf #a97a2c —
  siehe longpath-mark-light.svg.

  © 2026 Martin Fischer (OE5SOS). GPL, wie das ganze Programm.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"
     width="1024" height="1024" role="img"
     aria-label="Longpath: ein Ring mit dem langen Weg darin">
  <circle cx="50" cy="50" r="36" fill="none" stroke="#c4c4c9" stroke-width="10"/>
  <path d="M24 32 A 36 36 0 0 0 50 86 A 36 36 0 0 0 76 32"
        fill="none" stroke="#c2924f" stroke-width="8" stroke-linecap="round"/>
</svg>
