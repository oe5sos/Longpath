<!doctype html><html lang="de"><head><meta charset="utf-8">
<title>Entwurf B — Instrument</title><link rel="stylesheet" href="_grund.css">
<style>
/* ENTWURF B — Instrument.
   Die Gegenthese zu A: nicht aufraeumen, sondern weglassen.
   Das Band fuellt die obere Haelfte RANDLOS — kein Rahmen, keine Marge,
   die Flaeche selbst ist das Instrument. Frequenz und S-Meter liegen als
   Schrift darueber statt in eigenen Kaesten darunter; das spart zwei
   Panels und gibt dem Wasserfall ihre Hoehe.
   Unten bleibt genau eine Reihe Knoepfe im Daumenbereich plus die zwei
   Regler. Alles Seltene liegt hinter dem Zug am unteren Rand.
   Preis: man sieht weniger auf einen Blick. Gewinn: was man sieht, sieht
   man gross. */
.band{flex:1;position:relative;background:#0a1118;overflow:hidden}
.band canvas{position:absolute;left:0;right:0;width:100%}
/* Die Kurve beginnt UNTER der Schriftauflage. Im ersten Durchgang lag sie
   darunter und ihre Spitzen verschwanden hinter der Frequenz — eine
   Auflage darf den Messwert rahmen, nicht verdecken. */
#pan{top:118px;height:132px}
#wf{top:250px;bottom:0;height:calc(100% - 250px)}
.cursor{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(220,220,225,.4);z-index:3}
.cursor::before{content:"";position:absolute;left:-4px;top:0;width:9px;height:9px;
  background:var(--accent);border-radius:50%;box-shadow:0 0 8px rgba(74,123,168,.8)}
/* Schrift ueber dem Bild: ein Verlauf nach unten haelt sie lesbar, ohne
   dem Band einen Kasten aufzusetzen. */
.ueber{position:absolute;left:0;right:0;top:0;z-index:4;padding:10px 16px 26px;
  background:linear-gradient(rgba(6,9,13,.92),rgba(6,9,13,.55) 58%,rgba(6,9,13,0))}
.kopf{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px rgba(111,163,132,.7)}
.kopf .name{font-size:var(--f-caption);letter-spacing:.16em;text-transform:uppercase;color:var(--text3)}
.kopf .spacer{flex:1}
.kopf .rate{font-size:var(--f-caption);font-family:var(--mono);color:var(--text-inactive)}
.hz{font-size:44px;font-family:var(--mono);line-height:1;letter-spacing:-.015em;
    text-shadow:0 2px 12px rgba(0,0,0,.8)}
.hz .dez{color:var(--text-scale);font-size:24px}
.unterzeile{display:flex;align-items:baseline;gap:10px;margin-top:5px}
.unterzeile .b{font-size:var(--f-small);font-family:var(--mono);color:var(--measured)}
.unterzeile .spacer{flex:1}
.unterzeile .s{font-size:var(--f-sub);font-family:var(--mono);color:var(--measured);
  text-shadow:0 1px 8px rgba(0,0,0,.8)}
/* S-Meter als schmaler Streifen am unteren Rand des Bildes — Licht, kein Kasten */
.sstreifen{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:4;background:rgba(0,0,0,.45)}
.sstreifen i{position:absolute;left:0;top:0;bottom:0;width:62%;
  background:linear-gradient(90deg,rgba(216,165,95,.25),var(--measured));
  box-shadow:0 0 10px rgba(216,165,95,.55)}

.pult{flex:none;padding:12px 10px 0;background:var(--app-bg)}
.chips{display:flex;gap:6px}
.chip{flex:1;min-width:0;height:46px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:var(--f-small);font-family:var(--mono);color:var(--text2);
  background:linear-gradient(var(--glass-btn-top),var(--glass-btn-bot));
  border:1px solid var(--border);border-radius:9px;
  box-shadow:inset 0 1px 0 var(--light),0 1px 0 rgba(0,0,0,.5)}
.chip small{font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-inactive)}
.chip.on{background:linear-gradient(var(--glass-sel-top),var(--glass-sel-bot));
  border-color:var(--glass-sel-border);color:var(--glass-sel-text)}
.chip.on small{color:rgba(219,233,248,.6)}
.sliders{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.sl{display:flex;align-items:center;gap:10px}
.sl .caps{flex:0 0 30px}
.sl .track{flex:1;height:5px;border-radius:3px;background:var(--inset);
  border:1px solid var(--inset-border);position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.sl .track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);opacity:.55}
.sl .track b{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:linear-gradient(#5b8cba,#3a648c);border:1px solid #6b9ccb;box-shadow:0 1px 3px rgba(0,0,0,.7)}
.sl .v{flex:0 0 52px;text-align:right;font-family:var(--mono);font-size:var(--f-small);color:var(--measured)}
/* Der Zug: alles Seltene liegt darunter */
.zug{margin:16px auto 0;width:140px;height:4px;border-radius:2px;background:var(--border)}
.zugtext{text-align:center;margin:7px 0 12px;font-size:var(--f-caption);letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-inactive)}
</style></head><body>

<div class="band">
  <canvas id="pan" width="786" height="300"></canvas>
  <canvas id="wf" width="786" height="700"></canvas>
  <div class="cursor"></div>
  <div class="ueber">
    <div class="kopf"><span class="dot"></span><span class="name">Anvelina</span>
      <span class="spacer"></span><span class="rate">18 kB/s</span></div>
    <div class="hz mono">14.074<span class="dez">.000</span></div>
    <div class="unterzeile"><span class="b">20 m · USB · 2.4k</span>
      <span class="spacer"></span><span class="s">S8</span></div>
  </div>
  <div class="sstreifen"><i></i></div>
</div>

<div class="pult">
  <div class="chips">
    <span class="chip on">20<small>Band</small></span>
    <span class="chip">USB<small>Mode</small></span>
    <span class="chip">2.4k<small>Filter</small></span>
    <span class="chip">NB<small>aus</small></span>
    <span class="chip">NR<small>aus</small></span>
  </div>
  <div class="sliders">
    <div class="sl"><span class="caps">AF</span><div class="track"><i style="width:70%"></i><b style="left:70%"></b></div><span class="v">70 %</span></div>
    <div class="sl"><span class="caps">PWR</span><div class="track"><i style="width:55%"></i><b style="left:55%"></b></div><span class="v">55 %</span></div>
  </div>
  <div class="zug"></div>
  <div class="zugtext">mehr · senden nur in der App</div>
</div>

<script src="bild.js"></script>
<script>
malPan(document.getElementById('pan'), '#d8a55f', ['rgba(216,165,95,.30)','rgba(216,165,95,0)']);
malWf(document.getElementById('wf'));
</script>
</body></html>
