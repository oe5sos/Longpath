<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handfunke">
<meta name="theme-color" content="#08080a">
<title>Longpath Handfunke</title>
<link rel="stylesheet" href="stil.css">
<style>
/* Ergaenzungen, die das Entwurfsblatt nicht brauchte ───────────────────── */
/* 100dvh statt 100%: auf iOS faehrt Safaris Adresszeile ein und aus, und
   100% meint die GROSSE Hoehe — der untere Rand liegt dann ausserhalb des
   sichtbaren Bereichs. 100dvh folgt der Zeile. 100vh davor ist der Rueckfall
   fuer Browser, die dvh nicht kennen. */
html,body{width:100%;height:100vh;height:100dvh}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
     overflow-x:hidden;overflow-y:auto}
.scope{position:relative;touch-action:none}
.scope canvas{width:100%;height:auto}
/* Abstimmstrich in der Mitte — dort sitzt die Empfangsfrequenz */
.cursor{position:absolute;left:50%;top:0;bottom:0;width:1px;
        background:rgba(220,220,225,.30);pointer-events:none}
.cursor::before{content:"";position:absolute;left:-3px;top:0;width:7px;height:7px;
  background:var(--accent);border-radius:50%;transform:translateX(0)}
.dot.off{background:var(--text-inactive);box-shadow:none}
.dot.wait{background:var(--warn);box-shadow:0 0 6px rgba(168,133,63,.6)}
.chip{cursor:pointer;-webkit-user-select:none;user-select:none}
.chip:active{background:linear-gradient(var(--glass-btn-bot),var(--glass-btn-top))}
.sl .track{cursor:pointer}
/* Kopplungsblatt — nur beim ersten Start oder nach Verbindungsabriss */
#koppeln{position:fixed;inset:0;z-index:9;display:none;
  background:rgba(8,8,10,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 28px}
#koppeln.an{display:flex}
#koppeln h1{font-size:var(--f-sub);font-weight:600;letter-spacing:.06em;color:var(--title)}
#koppeln p{font-size:var(--f-small);color:var(--text3);text-align:center;line-height:1.5}
#koppeln input{width:100%;height:42px;padding:0 12px;border-radius:var(--r-chip);
  background:var(--inset);border:1px solid var(--inset-border);color:var(--text);
  font:var(--f-sub)/1 var(--mono);text-align:center;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.55)}
#koppeln input:focus{outline:none;border-color:var(--accent)}
#koppeln button{width:100%;height:46px;border-radius:var(--r-chip);
  background:linear-gradient(var(--glass-sel-top),var(--glass-sel-bot));
  border:1px solid var(--glass-sel-border);color:var(--glass-sel-text);
  font:600 var(--f-sub)/1 inherit;letter-spacing:.08em}
#koppeln .fehler{color:var(--warn);font-size:var(--f-small);min-height:16px}
/* Beide gesperrten Sendetasten nehmen auch keine Tipper an — nicht nur
   optisch tot, sondern wirklich. */
.tx.locked,.tune.locked{pointer-events:none}
</style>
</head>
<body>

<header>
  <span class="dot off" id="led"></span>
  <span class="name" id="station">NICHT VERBUNDEN</span>
  <span class="spacer"></span>
  <button id="tonAn" class="tonAn">TON EIN</button>
  <span class="rate mono" id="rate"></span>
</header>

<div class="vfo">
  <span class="hz mono" id="hz">—<span class="khz"></span><span class="dez"></span></span>
  <span class="unit">MHz</span>
  <span class="spacer"></span>
  <span class="b" id="band"></span>
</div>

<div class="scope" id="scope">
  <canvas id="pan" width="373" height="104"></canvas>
  <canvas id="wf"  width="373" height="196"></canvas>
  <div class="cursor"></div>
</div>

<div class="meter">
  <div class="row">
    <span class="caps">Signal</span>
    <span class="val" id="smeter">—</span>
  </div>
  <div class="bar"><i id="sbar" style="width:0%"></i></div>
  <div class="ticks">
    <span>1</span><span>3</span><span>5</span><span>7</span><span>9</span><span>+20</span><span>+40</span>
  </div>
</div>

<div class="group">
  <div class="caps">Betriebsart</div>
  <div class="chips" id="modes"></div>
</div>

<div class="group">
  <div class="caps">Band</div>
  <div class="chips" id="bands"></div>
</div>

<div class="sliders">
  <div class="sl">
    <span class="caps">AF</span>
    <div class="track" id="afTrack"><i id="afFill" style="width:0%"></i><b id="afKnob" style="left:0%"></b></div>
    <span class="v" id="afVal">—</span>
  </div>
  <div class="sl">
    <span class="caps">PWR</span>
    <div class="track" id="pwrTrack"><i id="pwrFill" style="width:0%"></i><b id="pwrKnob" style="left:0%"></b></div>
    <span class="v" id="pwrVal">—</span>
  </div>
</div>

<div class="group">
  <div class="caps">Filter</div>
  <div class="chips" id="filters"></div>
</div>

<div class="group">
  <div class="caps">Aufbereitung</div>
  <div class="chips" id="dsp"></div>
</div>

<div class="txrow">
  <div class="tx locked" id="tx">SENDEN <small>NUR IN DER APP</small></div>
  <div class="tune locked" id="tune">TUNE <small>NUR IN DER APP</small></div>
</div>

<footer>
  <span id="fussStatus">—</span>
  <span id="fussBild"></span>
  <span id="fussTon"></span>
</footer>

<div id="koppeln" class="an">
  <h1>LONGPATH HANDFUNKE</h1>
  <p>Adresse des Mac, auf dem Longpath läuft.<br>
     Setup&nbsp;→&nbsp;CAT&nbsp;&amp;&nbsp;Network&nbsp;→&nbsp;TCI&nbsp;Server muss
     eingeschaltet und auf die WLAN-Adresse gebunden sein.</p>
  <input id="adresse" type="text" inputmode="decimal" autocomplete="off"
         autocapitalize="off" spellcheck="false" placeholder="192.168.1.20:50001">
  <input id="token" type="text" autocomplete="off" autocapitalize="characters"
         spellcheck="false" placeholder="Token (nur über Netz nötig)">
  <div class="fehler" id="fehler"></div>
  <button id="verbinden">Verbinden</button>
</div>

<!-- ton-kern.js zuerst: app.js braucht TonKern fuer den Rueckfall auf
     ScriptProcessorNode, wenn AudioWorklet fehlt (LAN ueber http). Kein
     Modul, damit dieselbe Datei auch per addModule ins Worklet passt. -->
<!-- Stilles Tonelement, damit iOS die Seite als "Playback" einstuft und
     nicht als "Ambient". Begruendung in app.js bei stummesElementStarten():
     ohne das schaltet der Stummschalter am iPhone den eingebauten
     Lautsprecher ab, waehrend Kopfhoerer weiter spielen. Am 2026-10-01 genau
     so erlebt. Die Datei ist eine eine Sekunde lange Stille in WAV, als
     data:-URI eingebettet — kein zusaetzlicher Abruf. -->
<audio id="stillhalter" loop playsinline preload="auto"
       src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA="></audio>
<script src="ton-kern.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
