name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["cpp"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        # System libs only. Qt itself comes from install-qt-action below
        # so CodeQL matches ci.yml + release.yml (Qt 6.8.*). Apt qt6-*
        # on ubuntu-24.04 ships Qt 6.4.2, which is too old for
        # QRhiWidget and used to force -DLONGPATH_GPU_SPECTRUM=OFF here;
        # aligning Qt versions across all three workflows removes that
        # workaround and stops CodeQL drifting from CI behavior.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config g++ \
            libgl1-mesa-dev libfftw3-dev \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          # Qt 6.8+ folds qtsvg into qtbase; not listable as a module.
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      # Vendored and fetched third-party code stays byte-identical to its
      # upstream (docs/attribution/*-PROVENANCE.md), so a finding in it is
      # not ours to fix here and would only fail every PR that vendors a
      # library (ggmorse tripped seven integer-multiplication-cast-to-long
      # warnings on PR #30). A config-file paths-ignore only steers the
      # extractors of interpreted languages; for C/C++ everything that gets
      # compiled is analysed, so the results are filtered afterwards --
      # GitHub's documented route for compiled languages. build/ holds the
      # FetchContent checkouts (PortAudio, Opus, RNNoise).
      - name: Drop third-party code from the results
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -third_party/**
            -build/**
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: Upload the filtered results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
