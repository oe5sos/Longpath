# ======================================================================
# MESSLAUF — nicht zum Behalten gedacht
# ======================================================================
#
# Die Frage: bauen und laufen die C++-Pruefstaende auf Windows?
#
# ci.yml behauptet seit dem 2026-08-09 (c6b3eaa7f), die Attrappen seien
# "genuinely unported (mingw paths)". Diese Datei fragt die Maschine statt
# den Kommentar. Sie aendert ci.yml NICHT an.
#
# Aufbau so, dass EIN Lauf alles sagt:
#   1. Konfigurieren mit -DLONGPATH_BUILD_TESTS=ON  -> wieviele Pruefstaende
#      melden sich auf Windows ueberhaupt an (ctest -N)?
#   2. App bauen (bringt LongpathObjs + den gemeinsamen PCH).
#   3. ALLE Pruefstands-Uebersetzungseinheiten uebersetzen, OHNE zu linken,
#      mit `ninja -k 0` -- so bricht der Lauf nicht beim ersten Fehler ab,
#      sondern meldet jeden einzelnen.
#   4. Eine Handvoll namentlich genannter Kernlogik-Pruefstaende LINKEN und
#      FAHREN -- das ist die zweite offene Frage (Linken gegen LongpathObjs,
#      ws2_32 haengt in CMakeLists.txt:1514 nur am App-Ziel).
#
# Jeder Messschritt ist continue-on-error: ein roter Schritt darf die
# spaeteren Messungen nicht verhindern.
# ======================================================================

name: Windows-Messung (Pruefstaende)

on:
  push:
    branches:
      - 'ci/windows-pruefstaende'
      - 'ci/windows-pruefstaende-**'
  workflow_dispatch:

jobs:
  messung:
    runs-on: windows-latest
    name: Windows-Messung
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      # ── Abhaengigkeiten: wortgleich zu ci.yml's Windows-Zweig ────────
      - name: Install Qt (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja (Windows)
        run: choco install ninja -y

      - name: Download FFTW3 (Windows)
        shell: bash
        run: |
          mkdir -p third_party/fftw3/{include,lib,bin}
          curl -L -o /tmp/fftw3.zip "https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip"
          cd /tmp && unzip -o fftw3.zip -d fftw3
          cp /tmp/fftw3/fftw3.h $GITHUB_WORKSPACE/third_party/fftw3/include/
          cp /tmp/fftw3/libfftw3-3.dll $GITHUB_WORKSPACE/third_party/fftw3/bin/
          cp /tmp/fftw3/libfftw3-3.def $GITHUB_WORKSPACE/third_party/fftw3/lib/

      # ── 1. Konfigurieren MIT Pruefstaenden ───────────────────────────
      - name: 1 — Konfigurieren mit LONGPATH_BUILD_TESTS=ON
        id: konfig
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLONGPATH_GPU_SPECTRUM=ON \
            -DLONGPATH_BUILD_TESTS=ON 2>&1 | tee konfig.log

      - name: 1b — Wieviele Pruefstaende melden sich auf Windows an
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: build
        run: |
          ctest -N 2>&1 | tee ../ctest-N.log | tail -5
          echo "── Zahl der angemeldeten Pruefstaende ──"
          grep -cE '^[[:space:]]*Test[[:space:]]+#' ../ctest-N.log || true

      # ── 2. Die App bauen (LongpathObjs + PCH) ────────────────────────
      - name: 2 — App bauen
        id: app
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build build -j$NUMBER_OF_PROCESSORS 2>&1 | tail -40

      # ── 3. NUR die zwei Dateien, die im ersten Lauf gebrochen sind ───
      #
      # Lauf 39749806756 hat alle 2178 Objektziele unter tests/ uebersetzt
      # (57 min) und GENAU ZWEI Fehler gemeldet:
      #   tst_radio_discovery_scan_bound.cpp:33  arpa/inet.h: No such file
      #   tst_sendefehler_deutung.cpp:72         'EHOSTDOWN' not declared
      # Die Vollmessung noch einmal zu fahren kostet 57 min und sagt
      # nichts Neues. Hier stehen nur die zwei -- als Gegenprobe zur
      # Behebung.
      - name: 3 — Die zwei behobenen Dateien uebersetzen
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ninja -C build -k 0 \
            tests/CMakeFiles/tst_radio_discovery_scan_bound.dir/tst_radio_discovery_scan_bound.cpp.obj \
            tests/CMakeFiles/tst_sendefehler_deutung.dir/tst_sendefehler_deutung.cpp.obj \
            2>&1 | tee uebersetzen.log
          echo "ninja-Rueckgabe: ${PIPESTATUS[0]}"
          echo "── Fehlerzeilen ──"
          grep -cE '(^|[^a-zA-Z])(error|fatal error):' uebersetzen.log || echo 0

      # ── 4. Eine Handvoll Kernlogik-Pruefstaende LINKEN und FAHREN ────
      #
      # Namentlich, nicht nach Muster: diese fuenf brauchen keine
      # Oberflaeche (QTEST_APPLESS_MAIN laut tests/CMakeLists.txt) und
      # keinen Datenträgerpfad. Wenn das Linken gegen LongpathObjs auf
      # Windows grundsaetzlich bricht (etwa an ws2_32, das in
      # CMakeLists.txt:1514 nur am App-Ziel haengt), sagt es sich hier.
      - name: 4 — Fuenf Kernlogik-Pruefstaende linken
        id: linken
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ninja -C build -k 0 \
            tst_amateur_bands \
            tst_adif_log \
            tst_beam_heading \
            tst_callsign_cache \
            tst_alex_filter_map \
            tst_sendefehler_deutung \
            tst_radio_discovery_scan_bound > linken.log 2>&1
          RC=$?
          set -e
          echo "ninja-Rueckgabe: $RC"
          echo "── undefinierte Verweise (eindeutig) ──"
          grep -oE "undefined reference to \`[^']+'" linken.log | sort | uniq -c | sort -rn | head -40 || echo "(keine undefinierten Verweise)"
          echo
          tail -60 linken.log

      # ── 4b. WARUM haengen die Binaerdateien? ─────────────────────────
      #
      # Im ersten Lauf haben alle fuenf gelinkten Pruefstaende nach 120 s
      # Zeitueberschreitung gemeldet -- nicht rot, sondern haengend, alle
      # fuenf mit derselben Zahl. Das sieht nicht nach Prueflogik aus,
      # sondern nach dem Programmstart. Erste Vermutung: eine fehlende
      # DLL. Windows zeigt dafuer einen Fehlerdialog, und ein Dialog auf
      # einem Laeufer ohne Bediener haengt bis zum Zeitlimit.
      #
      # Das wird hier GEMESSEN, nicht geraten: welche DLLs die
      # Binaerdatei braucht, wo jede einzelne davon liegt, und dann
      # derselbe Lauf dreimal -- wie er ist, mit erweitertem PATH, und
      # mit offscreen dazu.
      - name: 4b — Welche DLLs braucht ein Pruefstand, und wo liegen sie
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          EXE=build/tests/tst_amateur_bands.exe
          ls -la "$EXE"
          echo "── Eingebundene DLLs ──"
          objdump -p "$EXE" | grep -i 'DLL Name' | sort -u
          echo
          echo "── Wo liegt jede davon? ──"
          QTBIN="$QT_ROOT_DIR/bin"
          MINGWBIN="$IQTA_TOOLS/mingw1310_64/bin"
          for d in $(objdump -p "$EXE" | grep -i 'DLL Name' | sed -E 's/.*DLL Name: *//' | sort -u); do
            FUND=""
            for ort in "build" "build/tests" "$QTBIN" "$MINGWBIN" \
                       "third_party/fftw3/bin" "C:/Windows/System32"; do
              if [ -f "$ort/$d" ]; then FUND="$ort"; break; fi
            done
            printf '%-28s %s\n' "$d" "${FUND:-NICHT GEFUNDEN}"
          done
          echo
          echo "── Liegt der Qt-Binaerordner im PATH? ──"
          echo "$PATH" | tr ':' '\n' | grep -iE 'Qt|mingw' || echo "nein"
          echo
          echo "── Plattform-Plugins von Qt auf Windows ──"
          ls "$QT_ROOT_DIR/plugins/platforms/" || true

      - name: 4c — Dieselben fuenf fahren, dreimal
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: build
        run: |
          set +e
          MUSTER='tst_amateur_bands|tst_adif_log|tst_beam_heading|tst_callsign_cache|tst_alex_filter_map'
          echo "=== a) wie es ist (Windows-Vorgabe, tests/CMakeLists.txt:117) ==="
          ctest --output-on-failure --timeout 25 -R "$MUSTER" 2>&1 | tail -25
          echo "Rueckgabe: $?"
          echo
          echo "=== b) PATH um Qt-, MinGW-, FFTW- und Bauordner erweitert ==="
          export PATH="$QT_ROOT_DIR/bin:$IQTA_TOOLS/mingw1310_64/bin:$GITHUB_WORKSPACE/third_party/fftw3/bin:$GITHUB_WORKSPACE/build:$PATH"
          ctest --output-on-failure --timeout 25 -R "$MUSTER" 2>&1 | tail -25
          echo "Rueckgabe: $?"
          echo
          echo "=== c) dasselbe mit QT_QPA_PLATFORM=offscreen ==="
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure --timeout 25 -R "$MUSTER" 2>&1 | tail -25
          echo "Rueckgabe: $?"
          echo
          echo "=== d) und die zwei behobenen dazu ==="
          QT_QPA_PLATFORM=offscreen ctest --output-on-failure --timeout 25 \
            -R 'tst_sendefehler_deutung|tst_radio_discovery_scan_bound' 2>&1 | tail -30
          echo "Rueckgabe: $?"

      - name: Protokolle hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-messung-protokolle
          path: |
            konfig.log
            ctest-N.log
            uebersetzen.log
            linken.log
            obj-ziele.txt
          retention-days: 14
          if-no-files-found: warn
