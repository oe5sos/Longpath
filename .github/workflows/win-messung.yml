# ======================================================================
# MESSLAUF 3 — die ZAHL holen, nicht zum Behalten gedacht
# ======================================================================
#
# Was die ersten zwei Laeufe ergeben haben:
#
#   39749806756  1082 Pruefstaende melden sich auf Windows an.
#                2178 Objektziele unter tests/ uebersetzt (57 min,
#                ninja -k 0), GENAU ZWEI Fehler. Linken traegt
#                (ninja 0, 105 s fuer fuenf). Alle fuenf gelinkten
#                Pruefstaende: ***Timeout 120 s.
#   39762280534  Die zwei Fehler behoben, beide uebersetzen. Der
#                Haenger ist der DLL-Suchpfad: ohne PATH-Erweiterung
#                5/5 Timeout, mit 5/5 Passed in 0,66 s. Qt bin liegt
#                im PATH, third_party/fftw3/bin und build/ nicht.
#
# Offen ist nur noch die ZAHL: wieviele der 1082 laufen durch, wenn
# alles gebaut und gefahren wird? Dafuer dieser Lauf -- vier Teile
# parallel, damit die Antwort in rund einer Stunde statt in drei da ist,
# bei gleicher Laeuferzeit.
#
# Die DLL-Behebung steckt jetzt in tests/CMakeLists.txt (Ziel
# longpath_test_dlls), NICHT hier im Arbeitsablauf. Dieser Lauf prueft
# sie also mit: wenn sie nicht reicht, meldet er wieder Zeitueberschreitungen.
# ======================================================================

name: Windows-Messung (Pruefstaende)

on:
  push:
    branches:
      - 'ci/windows-pruefstaende'
      - 'ci/windows-pruefstaende-**'
  workflow_dispatch:

jobs:
  messung:
    runs-on: windows-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: Windows-Messung (${{ matrix.shard }}/4)

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtmultimedia qtshadertools qtwebsockets'
          tools: 'tools_mingw1310'
          cache: true

      - name: Install Ninja (Windows)
        run: choco install ninja -y

      - name: Download FFTW3 (Windows)
        shell: bash
        run: |
          mkdir -p third_party/fftw3/{include,lib,bin}
          curl -L -o /tmp/fftw3.zip "https://fftw.org/pub/fftw/fftw-3.3.5-dll64.zip"
          cd /tmp && unzip -o fftw3.zip -d fftw3
          cp /tmp/fftw3/fftw3.h $GITHUB_WORKSPACE/third_party/fftw3/include/
          cp /tmp/fftw3/libfftw3-3.dll $GITHUB_WORKSPACE/third_party/fftw3/bin/
          cp /tmp/fftw3/libfftw3-3.def $GITHUB_WORKSPACE/third_party/fftw3/lib/

      - name: Konfigurieren (Teil ${{ matrix.shard }} von 4)
        shell: bash
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLONGPATH_GPU_SPECTRUM=ON \
            -DLONGPATH_BUILD_TESTS=ON \
            -DLONGPATH_TEST_SHARDS=4 \
            -DLONGPATH_TEST_SHARD=${{ matrix.shard }}

      - name: App bauen
        shell: bash
        run: cmake --build build -j$NUMBER_OF_PROCESSORS

      - name: Pruefstaende dieses Teils bauen
        id: testbau
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cmake --build build -j$NUMBER_OF_PROCESSORS -k 0 --target all_tests \
            > testbau.log 2>&1
          echo "Rueckgabe: $?"
          echo "── Zahl der Pruefstandsbinaerdateien ──"
          ls build/tests/*.exe 2>/dev/null | wc -l
          echo "── DLLs neben den Pruefstaenden (das ist die Behebung) ──"
          ls build/tests/*.dll 2>/dev/null || echo "KEINE -- dann haengt alles"
          echo "── Fehler beim Bau ──"
          grep -cE '^FAILED:' testbau.log || echo 0
          grep -E '^FAILED:' testbau.log | head -40
          echo "── Fehlerzeilen im Wortlaut (erste 60) ──"
          grep -nE '(^|[^a-zA-Z])(error|fatal error):' testbau.log | head -60

      - name: Fahren
        id: fahren
        continue-on-error: true
        shell: bash
        working-directory: build
        run: |
          set +e
          ctest --output-on-failure --timeout 120 > ../ctest.log 2>&1
          echo "ctest-Rueckgabe: $?"
          echo
          tail -80 ../ctest.log
          echo
          echo "══ ZUSAMMENFASSUNG Teil ${{ matrix.shard }}/4 ══"
          grep -E '^[0-9]+% tests passed' ../ctest.log || true
          echo "── Zeitueberschreitungen ──"
          grep -cE '\(Timeout\)' ../ctest.log || echo 0
          echo "── sonstige Fehlschlaege ──"
          grep -cE '\(Failed\)' ../ctest.log || echo 0
          echo "── Namen aller Gescheiterten ──"
          grep -E '^\s+[0-9]+ - ' ../ctest.log || echo "(keine)"

      - name: Protokolle hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win-messung-teil${{ matrix.shard }}
          path: |
            testbau.log
            ctest.log
          retention-days: 14
          if-no-files-found: warn
