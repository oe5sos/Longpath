name: Release

# ── Keine Windows-Pakete mehr (2026-10-07) ────────────────────────────
#
# Betreiber: „bitte keine windowsversion". Der Job `build-windows` und
# seine beiden Pakete (`-Windows-x64-setup.exe`, `-Windows-x64-portable
# .zip`) sind hier herausgenommen.
#
# Warum: gebaut wurden sie, geprueft nie. Auf der Website standen sie mit
# „Signiert · ungeprueft · Tonproblem offen" — unter Windows ist eine
# Tonverzerrung mit der ANAN-10 seit zwei Anlaeufen unverstanden
# (CHANGELOG 0.6.3-rc1). Ein Paket herauszugeben, von dem man weiss, dass
# es nicht geht, ist schlechter als keines.
#
# Der Windows-Bau in `ci.yml` bleibt: er haelt den Quelltext
# uebersetzbar und kostet niemanden einen Download.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re-)build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and validate format
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "Tag: $TAG"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not match vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CMakeLists.txt version matches tag
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VER=$(grep -oE 'project\(Longpath VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $3}')
          TAG_VER="${{ steps.meta.outputs.version }}"
          BASE_VER="${TAG_VER%%-*}"
          if [[ "$CMAKE_VER" != "$BASE_VER" ]]; then
            echo "::error::CMakeLists.txt version ($CMAKE_VER) != tag version ($BASE_VER)"
            exit 1
          fi
          echo "Version match: $CMAKE_VER"

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {flag=0}
            flag {print}
          ' CHANGELOG.md > release_notes.md
          if [[ ! -s release_notes.md ]]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi
          echo "----- release notes -----"
          cat release_notes.md
          echo "-------------------------"

      - name: Append release-notes template
        shell: bash
        run: |
          if [[ -f .github/release-notes-template.md ]]; then
            echo "" >> release_notes.md
            cat .github/release-notes-template.md >> release_notes.md
          fi

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 1

  build-linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Beide Zeilen mit offiziellem Qt 6.8.3 (2026-09-29). x86_64 baut
          # auf Ubuntu 22.04 und braucht hoechstens glibc 2.35. Fuer ARM
          # geht das nicht: Qts eigene aarch64-Werkzeuge (moc, rcc) sind
          # selbst gegen glibc 2.38 gebaut und laufen auf ubuntu-22.04-arm
          # gar nicht (v0.6.5, erster Lauf: "GLIBC_2.38 not found" beim
          # moc). Die ARM-Zeile baut darum auf ubuntu-24.04-arm und
          # verlangt glibc 2.38 -- wie 0.6.4, Raspberry Pi OS Bookworm
          # (2.36) bleibt aussen vor.
          - runner: ubuntu-22.04
            arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            glibc_floor: "2.35"
          - runner: ubuntu-24.04-arm
            arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            glibc_floor: "2.38"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ccache \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-xfixes0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio gstreamer1.0-gl \
            libgstreamer-gl1.0-0 libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libfuse2 file desktop-file-utils \
            libfftw3-dev imagemagick \
            libasound2-dev libjack-jackd2-dev \
            libpipewire-0.3-dev

      - name: Install Qt 6.8 via aqtinstall
        run: |
          pip3 install aqtinstall
          # Qt 6.8+ folds qtsvg/qttools/qttranslations into qtbase; not listable as -m modules.
          # qtserialport (2026-09-29): ohne das Modul baute Longpath ohne
          # serielles PTT/CW -- in 0.6.4 hatten es nur Mac Apple Silicon
          # (Homebrew-Qt) und Windows. qtimageformats: WebP/TIFF, die die
          # Bilddialoge (Panadapter-Hintergrund, Weltkarte) anbieten.
          aqt install-qt ${{ matrix.qt_host }} desktop 6.8.3 ${{ matrix.qt_arch }} \
            -m qtmultimedia qtshadertools qtwebsockets qtserialport qtimageformats \
            --outputdir ${{ github.workspace }}/Qt
          # Der Ordnername haengt an der Architektur (gcc_64, gcc_arm64 ...);
          # gesucht statt geraten.
          QTDIR=$(dirname "$(dirname "$(ls -d ${{ github.workspace }}/Qt/6.8.3/*/bin/qmake | head -1)")")
          test -x "$QTDIR/bin/qmake" || { echo "::error::Qt 6.8.3 nicht gefunden"; exit 1; }
          echo "QTDIR=$QTDIR" >> $GITHUB_ENV
          echo "Qt6_DIR=$QTDIR/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$QTDIR" >> $GITHUB_ENV
          echo "PATH=$QTDIR/bin:$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$QTDIR/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up DeepFilterNet3 library
        run: bash setup-deepfilter.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: release-ccache-linux-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          restore-keys: |
            release-ccache-linux-${{ matrix.arch }}-

      - name: Configure
        run: |
          ccache --max-size=2G
          CMAKE_EXTRA="-DCMAKE_PREFIX_PATH=$QTDIR"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            # Bis 0.6.4 zwangsweise (Ubuntus Qt 6.4 hatte kein QRhiWidget).
            # Mit Qt 6.8 ginge der GPU-Panadapter, auf ARM-Grafik (Raspberry
            # Pi) ist er aber ungeprueft: der erprobte CPU-Weg bleibt.
            CMAKE_EXTRA="$CMAKE_EXTRA -DLONGPATH_GPU_SPECTRUM=OFF"
          fi
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            $CMAKE_EXTRA

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=ignore

      - name: Install to AppDir
        run: |
          DESTDIR=${{ github.workspace }}/AppDir cmake --install build

      - name: Download linuxdeploy + Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch }}.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.arch }}.AppImage linuxdeploy-plugin-qt-${{ matrix.arch }}.AppImage

      - name: Bundle models and license files into AppDir
        run: |
          # rnnoise models
          mkdir -p AppDir/usr/share/Longpath/models/rnnoise
          cp third_party/rnnoise/models/Default_large.bin  AppDir/usr/share/Longpath/models/rnnoise/
          cp third_party/rnnoise/models/Default_small.bin  AppDir/usr/share/Longpath/models/rnnoise/
          # DeepFilterNet3 ONNX tarball
          mkdir -p AppDir/usr/share/Longpath/models/dfnet3
          cp third_party/deepfilter/models/DeepFilterNet3_onnx.tar.gz AppDir/usr/share/Longpath/models/dfnet3/
          # NNR (Neural Noise Reduction, WDSP 2.10) models
          mkdir -p AppDir/usr/share/Longpath/models/nnr
          cp third_party/wdsp/models/wdsp_nnr_0.bin AppDir/usr/share/Longpath/models/nnr/
          cp third_party/wdsp/models/wdsp_nnr_1.bin AppDir/usr/share/Longpath/models/nnr/
          # License files — DFNR (Apache-2.0 + MIT) and rnnoise (BSD)
          mkdir -p AppDir/usr/share/doc/Longpath/deepfilter
          cp third_party/deepfilter/LICENSE       AppDir/usr/share/doc/Longpath/deepfilter/
          cp third_party/deepfilter/LICENSE-APACHE AppDir/usr/share/doc/Longpath/deepfilter/
          cp third_party/deepfilter/LICENSE-MIT   AppDir/usr/share/doc/Longpath/deepfilter/
          cp third_party/deepfilter/COMMIT        AppDir/usr/share/doc/Longpath/deepfilter/
          mkdir -p AppDir/usr/share/doc/Longpath/rnnoise
          cp third_party/rnnoise/LICENSE          AppDir/usr/share/doc/Longpath/rnnoise/

      - name: Build AppImage
        env:
          LDAI_OUTPUT: Longpath-${{ needs.prepare.outputs.version }}-${{ matrix.arch }}.AppImage
          QT_SELECT: qt6
          EXTRA_QT_PLUGINS: multimedia
        run: |
          export QMAKE="$QTDIR/bin/qmake"
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/Longpath.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Longpath
          Exec=Longpath
          Icon=nereussdr
          Categories=HamRadio;Audio;
          Comment=Cross-platform OpenHPSDR SDR Console (GPLv3 port of Thetis / mi0bot / FlexRadio PowerSDR lineage)
          DESKTOP
          # Install the real Longpath icon at standard hicolor sizes.
          # Uses the pre-rendered PNGs from resources/icons/Longpath.iconset/
          # so there is no image-processing dependency on the runner (the
          # previous implementation called `convert` and fell back to `touch`,
          # which either produced a placeholder "NSDR" text bitmap or a
          # zero-byte file — neither is a usable icon). linuxdeploy creates
          # the top-level .DirIcon symlink automatically based on the
          # .desktop file's `Icon=nereussdr` field, so file managers will
          # thumbnail the AppImage correctly.
          for size in 16 32 64 128 256 512; do
            mkdir -p AppDir/usr/share/icons/hicolor/${size}x${size}/apps
          done
          cp resources/icons/Longpath.iconset/icon_16x16.png     AppDir/usr/share/icons/hicolor/16x16/apps/nereussdr.png
          cp resources/icons/Longpath.iconset/icon_32x32.png     AppDir/usr/share/icons/hicolor/32x32/apps/nereussdr.png
          cp resources/icons/Longpath.iconset/icon_32x32@2x.png  AppDir/usr/share/icons/hicolor/64x64/apps/nereussdr.png
          cp resources/icons/Longpath.iconset/icon_128x128.png   AppDir/usr/share/icons/hicolor/128x128/apps/nereussdr.png
          cp resources/icons/Longpath.iconset/icon_256x256.png   AppDir/usr/share/icons/hicolor/256x256/apps/nereussdr.png
          cp resources/icons/Longpath.iconset/icon_512x512.png   AppDir/usr/share/icons/hicolor/512x512/apps/nereussdr.png

          # The vendored RADE library (third_party/rade/src/CMakeLists.txt
          # ports radae_nopy at b289102) builds librade.so.0.1 as a SHARED
          # target in the CMake build tree with no install() declaration,
          # so the "Install to AppDir" cmake --install step does not copy
          # it into AppDir/usr/lib. linuxdeploy traces NEEDED ELF deps via
          # ld.so / LD_LIBRARY_PATH / RPATH and does NOT scan AppDir/usr/lib
          # by default, so it bails with:
          #   ERROR: Could not find dependency: librade.so.0.1
          # The --library flag SHOULD register the lib but in the linuxdeploy
          # continuous build (1-alpha @a9f929f) it did not — linuxdeploy
          # errored on the Longpath dep trace before processing --library.
          # Use the documented LD_LIBRARY_PATH approach instead: prepend the
          # build-tree directory containing librade.so* to LD_LIBRARY_PATH so
          # linuxdeploy's standard resolver finds it during dep tracing and
          # auto-copies it into AppDir/usr/lib.
          LIBRADE_PATH="$(find build/third_party/rade -maxdepth 4 -name 'librade.so.0.1' | head -n1)"
          if [ -z "$LIBRADE_PATH" ]; then
            echo "ERROR: librade.so.0.1 not found in build tree" >&2
            find build -name 'librade.so*' >&2
            exit 1
          fi
          LIBRADE_DIR="$(dirname "$LIBRADE_PATH")"
          echo "Adding $LIBRADE_DIR to LD_LIBRARY_PATH for linuxdeploy"
          export LD_LIBRARY_PATH="$PWD/$LIBRADE_DIR:$LD_LIBRARY_PATH"

          ./linuxdeploy-${{ matrix.arch }}.AppImage \
            --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/Longpath.desktop \
            --output appimage

      # Untergrenze pruefen (2026-09-29): keine Datei im AppImage darf
      # eine neuere glibc verlangen als Ubuntu 22.04 hat. 0.6.4 brauchte
      # auf ARM 2.38 und lief auf dem Raspberry Pi nicht -- das faellt
      # jetzt beim Bauen auf, nicht beim Anwender.
      - name: Check glibc floor (${{ matrix.glibc_floor }})
        run: |
          max=$(find AppDir -type f \( -name '*.so*' -o -path '*/bin/*' \) \
                | while read -r f; do objdump -T "$f" 2>/dev/null; done \
                | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "hoechste verlangte glibc: $max"
          if [ -z "$max" ]; then
            echo "::error::Keine ELF-Datei mit glibc-Bezug im AppDir gefunden -- Pruefung kaputt?"
            exit 1
          fi
          floor="GLIBC_${{ matrix.glibc_floor }}"
          if [ "$(printf '%s\n' "$max" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::Das AppImage verlangt $max -- Untergrenze ist glibc ${{ matrix.glibc_floor }}."
            find AppDir -type f \( -name '*.so*' -o -path '*/bin/*' \) | while read -r f; do
              objdump -T "$f" 2>/dev/null | grep -q "$max" && echo "  $f"
            done
            exit 1
          fi

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: Longpath-*.AppImage
          retention-days: 7

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Beide Zeilen: offizielles Qt 6.8 (aqtinstall) und FFTW aus dem
          # Quelltext, Untergrenze macOS 12 -- die kleinste, die Qt 6.8
          # traegt (2026-09-29). Bis 0.6.4 nahm die arm64-Zeile Qt und FFTW
          # aus Homebrew; deren Flaschen sind fuer das macOS des Laeufers
          # gebaut (minos 15.0), und die Apple-Silicon-Fassung startete
          # erst ab macOS 15 -- trotz „14.0" hier.
          - runner: macos-15
            arch: arm64
            dmg_suffix: macOS-apple-silicon
            deployment_target: "12.0"
          # Intel Mac restored 2026-05-03 via cross-compile from the abundant
          # Apple Silicon runner. Native macos-13 was unviable: original Phase
          # 3N attempt failed on label rejection (2026-04-12); re-attempt found
          # the runner pool effectively empty (queue waits >13 min with no
          # allocation as Apple deprecates Intel CI). Cross-compile path uses
          # aqtinstall for Qt, FFTW from source, and Rust target
          # x86_64-apple-darwin. ctest runs via Rosetta on the arm64 host.
          - runner: macos-15
            arch: x86_64
            dmg_suffix: macOS-intel
            # War „11.0"; Qt 6.8 selbst verlangt 12.0 (so stand es in jeder
            # Qt-Bibliothek von 0.6.4) -- die 11 war nie wahr.
            deployment_target: "12.0"
    runs-on: ${{ matrix.runner }}
    # Capture the Apple Developer ID secret into a job-level env var so
    # step-level `if:` guards can evaluate it. GitHub Actions forbids
    # `secrets.*` directly in step-level `if:` expressions — they're
    # evaluated at workflow-parse time before secrets inject. Job-level
    # env is populated after secrets are available.
    env:
      HAS_APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID != '' }}
      # Auch fuer alles, was nicht ueber CMAKE_OSX_DEPLOYMENT_TARGET geht:
      # autotools (Opus in third_party/rade), cargo (DeepFilterNet3).
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # Qt 6.8 linkt am Mac noch AGL.framework mit; das macOS-26-SDK
      # (Xcode 26) hat es nicht mehr: „ld: framework 'AGL' not found"
      # (lokal nachgestellt 2026-09-29). Qt 6.8 ist die letzte Reihe, die
      # macOS 12 traegt -- also Xcode 16 (SDK 15) festhalten, statt zu
      # hoffen, dass der Laeufer es als Vorgabe hat.
      - name: Select Xcode 16 (SDK with AGL for Qt 6.8)
        run: |
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::Kein Xcode 16 auf dem Laeufer -- Qt 6.8 braucht das SDK mit AGL."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          SDK="$(xcrun --show-sdk-path)"
          echo "SDK: $SDK"
          test -d "$SDK/System/Library/Frameworks/AGL.framework" \
            || { echo "::error::$SDK hat kein AGL.framework"; exit 1; }

      - name: Install build tools (brew)
        # Nur Werkzeuge -- nichts, was ins Paket gelinkt wird. Homebrew-
        # Bibliotheken sind fuer das macOS des Laeufers gebaut und wuerden
        # die Untergrenze hochziehen (siehe deployment_target oben).
        # autoconf/automake/libtool/wget required by third_party/rade
        # vendored Opus (autotools + wget DRED model download). Not in
        # default macOS runner image.
        run: brew install ninja create-dmg ccache autoconf automake libtool wget

      - name: Install Qt 6.8 via aqtinstall
        # clang_64 ist universell (x86_64 + arm64). qtserialport
        # (2026-09-29): fehlte in der Intel-Fassung, also kein serielles
        # PTT/CW dort. qtimageformats: WebP/TIFF fuer die Bilddialoge.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia qtshadertools qtwebsockets qtserialport qtimageformats'
          cache: true

      - name: Build FFTW from source (both precisions)
        run: |
          # Longpath needs both libfftw3 (double, for libspecbleach + WDSP)
          # and libfftw3f (single, for FFTEngine). FFTW autotools forces one
          # precision per configure run, so we run install twice into the
          # same prefix.
          PREFIX="${{ github.workspace }}/fftw-${{ matrix.arch }}"
          CFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.deployment_target }}"
          # --host nur beim Kreuzbau; arm64 baut auf dem arm64-Laeufer nativ.
          HOSTARG=""
          if [ "${{ matrix.arch }}" = "x86_64" ]; then HOSTARG="--host=x86_64-apple-darwin"; fi
          curl -fsSL https://fftw.org/pub/fftw/fftw-3.3.10.tar.gz -o fftw.tar.gz
          tar xzf fftw.tar.gz
          cd fftw-3.3.10

          # Pass 1 — double precision (libfftw3)
          ./configure --enable-shared --disable-doc \
            --prefix="$PREFIX" CFLAGS="$CFLAGS" $HOSTARG
          make -j$(sysctl -n hw.ncpu)
          make install
          make distclean

          # Pass 2 — single precision (libfftw3f)
          ./configure --enable-single --enable-shared --disable-doc \
            --prefix="$PREFIX" CFLAGS="$CFLAGS" $HOSTARG
          make -j$(sysctl -n hw.ncpu)
          make install

          # Sanity-check both precisions installed
          test -f "$PREFIX/include/fftw3.h"            || { echo "::error::fftw3.h not installed"; exit 1; }
          test -f "$PREFIX/lib/pkgconfig/fftw3.pc"     || { echo "::error::fftw3.pc not installed"; exit 1; }
          test -f "$PREFIX/lib/pkgconfig/fftw3f.pc"    || { echo "::error::fftw3f.pc not installed"; exit 1; }
          test -f "$PREFIX/lib/libfftw3.dylib"         || { echo "::error::libfftw3 (double) not installed"; exit 1; }
          test -f "$PREFIX/lib/libfftw3f.dylib"        || { echo "::error::libfftw3f (single) not installed"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Add the cross-compile target on the Intel matrix row so DFNR
          # builds for x86_64; leave native arm64 to default host triple.
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || '' }}

      # Import Apple Developer ID certs into a temporary keychain so
      # codesign / productbuild can find them. Gated on the secret being
      # present so dev builds without secrets still complete (they fall
      # back to ad-hoc codesign in the "Codesign app" step below).
      - name: Import Apple certs
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          P12_PATH="$RUNNER_TEMP/certs.p12"

          echo -n "$APPLE_CERT_P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -P "$APPLE_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Add temp keychain to the search list so codesign finds the certs
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          # Allow codesign / productbuild to use the keys without prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productbuild: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify both identities are visible
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm "$P12_PATH"

      - name: Set up DeepFilterNet3 library
        env:
          # Coerces setup-deepfilter.sh to build for the matrix arch instead
          # of the host arch (uname -m). Without this the cross-compile row
          # would build aarch64 DFNR and the link step would fail.
          LONGPATH_TARGET_ARCH: ${{ matrix.arch }}
        run: bash setup-deepfilter.sh

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: release-ccache-macos-${{ matrix.arch }}-${{ needs.prepare.outputs.tag }}
          restore-keys: |
            release-ccache-macos-${{ matrix.arch }}-

      - name: Configure
        run: |
          ccache --max-size=2G
          # FFTW comes from our source build at fftw-<arch> on both rows.
          # PKG_CONFIG_PATH lets Longpath's pkg_check_modules(FFTW3 fftw3)
          # find it; LDFLAGS adds -L so the linker resolves -lfftw3
          # (Longpath's third_party CMakeLists.txt files only call
          # target_link_libraries, not target_link_directories). Qt is
          # installed by jurplel/install-qt-action and exposed via
          # Qt6_DIR / QT_ROOT_DIR. Homebrew's prefix stays OUT of the
          # search path: anything found there would drag its minos along.
          FFTW_PREFIX="${{ github.workspace }}/fftw-${{ matrix.arch }}"
          export PKG_CONFIG_PATH="$FFTW_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L$FFTW_PREFIX/lib $LDFLAGS"
          CMAKE_PREFIX_PATH_VAL="$FFTW_PREFIX;$QT_ROOT_DIR"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}" \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_VAL" \
            -DLONGPATH_HOMEBREW_PATHS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --no-tests=ignore

      - name: Bundle Qt frameworks
        run: |
          # macdeployqt from aqtinstall on both rows (QT_ROOT_DIR, set by
          # jurplel/install-qt-action).
          "$QT_ROOT_DIR/bin/macdeployqt" build/Longpath.app -verbose=1 -always-overwrite

      - name: Copy license notices into app bundle
        run: |
          mkdir -p build/Longpath.app/Contents/Resources/licenses
          cp -r packaging/third-party-licenses/. build/Longpath.app/Contents/Resources/licenses/
          cp LICENSE LICENSE-DUAL-LICENSING build/Longpath.app/Contents/Resources/licenses/
          # DFNR (Apache-2.0 + MIT) and rnnoise (BSD) license files
          mkdir -p build/Longpath.app/Contents/Resources/licenses/deepfilter
          cp third_party/deepfilter/LICENSE       build/Longpath.app/Contents/Resources/licenses/deepfilter/
          cp third_party/deepfilter/LICENSE-APACHE build/Longpath.app/Contents/Resources/licenses/deepfilter/
          cp third_party/deepfilter/LICENSE-MIT   build/Longpath.app/Contents/Resources/licenses/deepfilter/
          cp third_party/deepfilter/COMMIT        build/Longpath.app/Contents/Resources/licenses/deepfilter/
          mkdir -p build/Longpath.app/Contents/Resources/licenses/rnnoise
          cp third_party/rnnoise/LICENSE          build/Longpath.app/Contents/Resources/licenses/rnnoise/

      - name: Bundle models into app bundle
        run: |
          # rnnoise models
          mkdir -p build/Longpath.app/Contents/Resources/models/rnnoise
          cp third_party/rnnoise/models/Default_large.bin  build/Longpath.app/Contents/Resources/models/rnnoise/
          cp third_party/rnnoise/models/Default_small.bin  build/Longpath.app/Contents/Resources/models/rnnoise/
          # DeepFilterNet3 ONNX tarball
          mkdir -p build/Longpath.app/Contents/Resources/models/dfnet3
          cp third_party/deepfilter/models/DeepFilterNet3_onnx.tar.gz build/Longpath.app/Contents/Resources/models/dfnet3/
          # NNR (Neural Noise Reduction, WDSP 2.10) models
          mkdir -p build/Longpath.app/Contents/Resources/models/nnr
          cp third_party/wdsp/models/wdsp_nnr_0.bin build/Longpath.app/Contents/Resources/models/nnr/
          cp third_party/wdsp/models/wdsp_nnr_1.bin build/Longpath.app/Contents/Resources/models/nnr/

      # Untergrenze pruefen (2026-09-29): keine Datei im Paket darf ein
      # neueres macOS verlangen als deployment_target, und jede muss die
      # Architektur der Zeile tragen. 0.6.4 Apple Silicon verlangte 15.0
      # und startete auf macOS 12-14 nicht -- das faellt jetzt hier auf.
      - name: Check macOS floor and architecture
        run: packaging/macos/check-min-macos.sh build/Longpath.app "${{ matrix.deployment_target }}" "${{ matrix.arch }}"

      # Sign the .app bundle. With APPLE_DEVELOPER_ID set we use Developer
      # ID + hardened runtime + entitlements (required for notarization).
      # Without secrets we fall back to ad-hoc so dev builds still work.
      - name: Codesign app
        run: |
          if [ "$HAS_APPLE_DEVELOPER_ID" = "true" ]; then
            codesign --force --deep --options runtime --timestamp \
              --entitlements packaging/macos/app-entitlements.plist \
              --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
              build/Longpath.app
          else
            codesign --force --deep --sign - build/Longpath.app
          fi
          codesign --verify --verbose=2 build/Longpath.app

      - name: Build HAL plugin
        run: |
          # Thread the matrix arch + deployment target through so the HAL
          # plugin matches the host app bundle on both rows.
          cmake -B build-hal -S hal-plugin -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}"
          cmake --build build-hal

      - name: Sign HAL plugin
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/hal-entitlements.plist \
            --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
            build-hal/LongpathVAX.driver

      - name: Build .pkg
        env:
          APPLE_INSTALLER_ID: ${{ secrets.APPLE_INSTALLER_ID }}
          # Pass the FULL tag version (including any -rcN / -alpha / -beta
          # suffix) so productbuild writes the correctly-suffixed PKG at
          # the same path the notarize/staple/upload steps below expect.
          # CMakeLists.txt VERSION can only carry the numeric base, so the
          # packaging script's CMake-parse fallback would otherwise drop
          # the suffix and break pre-release builds.
          VERSION: ${{ needs.prepare.outputs.version }}
          # PKG_SUFFIX selects the arch-tagged segment of the PKG filename
          # so the two matrix rows do not collide in the staging step
          # below. Mirrors the DMG dmg_suffix convention.
          PKG_SUFFIX: ${{ matrix.dmg_suffix }}
        run: bash packaging/macos/hal-installer.sh

      - name: Notarize .pkg
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          xcrun notarytool submit \
            build/Longpath-${{ needs.prepare.outputs.version }}-${{ matrix.dmg_suffix }}.pkg \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --wait

      - name: Staple .pkg
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          xcrun stapler staple \
            build/Longpath-${{ needs.prepare.outputs.version }}-${{ matrix.dmg_suffix }}.pkg

      - name: Create DMG
        run: |
          # Background is paired @1x + @2x for Retina sharpness. create-dmg
          # picks up the @2x sibling automatically when both files share the
          # same basename in the same directory.
          create-dmg \
            --volname "Longpath" \
            --volicon "resources/icons/Longpath.icns" \
            --background "packaging/macos/dmg-background.png" \
            --window-pos 200 120 \
            --window-size 680 384 \
            --icon-size 96 \
            --icon "Longpath.app" 160 200 \
            --hide-extension "Longpath.app" \
            --app-drop-link 540 200 \
            "Longpath-${{ needs.prepare.outputs.version }}-${{ matrix.dmg_suffix }}.dmg" \
            "build/Longpath.app" \
          || true
          ls -la Longpath-*.dmg

      - name: Codesign DMG
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          DMG_PATH=$(ls Longpath-*.dmg | head -1)
          codesign --force --timestamp \
            --sign "${{ secrets.APPLE_DEVELOPER_ID }}" \
            "$DMG_PATH"

      - name: Notarize DMG
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          DMG_PATH=$(ls Longpath-*.dmg | head -1)
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_PASSWORD }}" \
            --wait

      - name: Staple DMG
        if: env.HAS_APPLE_DEVELOPER_ID == 'true'
        run: |
          DMG_PATH=$(ls Longpath-*.dmg | head -1)
          xcrun stapler staple "$DMG_PATH"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-hal-pkg-${{ matrix.arch }}
          path: build/Longpath-*.pkg
          retention-days: 7

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: Longpath-*.dmg
          retention-days: 7

  sign-and-publish:
    # Kein Windows mehr: Betreiberentscheidung 2026-10-07.
    # Begruendung am Kopf dieser Datei.
    needs: [prepare, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          find downloaded -type f \( \
            -name '*.AppImage' -o \
            -name '*.dmg' -o \
            -name '*.pkg' -o \
            -name '*.zip' -o \
            -name '*-setup.exe' -o \
            -name 'release_notes.md' \
          \) -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Generate source tarball
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          git archive --format=tar.gz \
            --prefix="Longpath-${VERSION}/" \
            "${TAG}" > "artifacts/Longpath-${VERSION}-source.tar.gz"

      - name: Fetch FFTW3 corresponding source (GPLv2 §3 / GPLv3 §6)
        # The Windows installer + portable ZIP bundle a prebuilt
        # libfftw3f-3.dll. FFTW is GPLv2-or-later, so the binary
        # distribution must be accompanied by the corresponding source on
        # the same medium (a GitHub Release IS the medium). Ship the exact
        # upstream source archive used to build the bundled DLL alongside
        # the installer artifacts so recipients receive both atomically.
        run: |
          curl -fsSL "https://fftw.org/pub/fftw/fftw-3.3.5.tar.gz" \
            -o "artifacts/fftw-3.3.5.tar.gz"
          ls -la artifacts/fftw-3.3.5.tar.gz

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          # exclude release_notes.md from sums (not a release artifact)
          sha256sum $(ls | grep -v '^release_notes.md$') > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_FP=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "${KEY_FP}:6:" | gpg --import-ownertrust
          gpg --list-secret-keys

      - name: Sign artifacts
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        working-directory: artifacts
        run: |
          for f in *.AppImage *.dmg *.pkg *.zip *.exe *.tar.gz SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "$f"
          done
          ls -la

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # nullglob so a platform-less partial release (e.g. a
          # mac-only or windows-only tag, temporarily scoped via the
          # build-* `if:` guards above) doesn't pass gh an unmatched
          # literal glob string for an artifact type that simply
          # wasn't built this run.
          shopt -s nullglob
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [[ "${{ needs.prepare.outputs.is_prerelease }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Delete existing draft for this tag if rerunning
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" \
            --title "Longpath ${VERSION}" \
            --notes-file artifacts/release_notes.md \
            --draft \
            $PRERELEASE_FLAG \
            artifacts/*.AppImage \
            artifacts/*.dmg \
            artifacts/*.pkg \
            artifacts/*.zip \
            artifacts/*-setup.exe \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS.txt \
            artifacts/*.asc

      - name: Print release URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL=$(gh release view "${{ needs.prepare.outputs.tag }}" --json url -q .url)
          echo "Draft release: $URL"
          echo "## Draft release" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
